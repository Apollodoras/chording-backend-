[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit, because flat-layout auto-discovery trips over `tests`/`bench`/
# `scripts` sitting beside `app` and refuses to guess.
[tool.setuptools]
packages = ["app", "app.analysis"]

[project]
name = "chords-backend"
version = "0.1.0"
description = "Chord analysis for Rosetta GP — turns a video id into a CompositionPayload v2 song (chord-backend-handoff.md)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    # Multipart parsing for `POST /v1/analyze/upload`. FastAPI needs it present
    # to serve a form body at all, and it is a parser rather than an audio
    # dependency — the API container still cannot decode anything.
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "firebase-admin>=6.5",
    # The Postgres store. Imported lazily in app/store.py, so a SQLite-only run
    # never touches it — but it ships in the deployed image. Same seam as Mo's.
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# The audio half. Deliberately NOT a default dependency: the API container must
# not be able to fetch or decode audio at all (handoff §2.1 blast radius, §4
# "worker isolation matters"). Only the worker image installs this group, and
# only the worker function is granted the credentials it needs.
#
# What every engine needs, and the fetch stage. Not enough to analyze anything
# on its own — add an `engines-*` group for that.
audio = [
    "yt-dlp>=2024.8",
    # <2.1 is a real constraint, not caution: numba (via librosa) tops out
    # there on the wheels that exist for macOS x86_64, and building llvmlite
    # from source needs a matching LLVM. The old `<2` pin was for madmom, which
    # this build no longer uses — upstream madmom does not import on Python
    # 3.11 at all (see app/analysis/engines.py).
    "numpy>=1.26,<2.1",
    "soundfile>=0.12",
]

# The chosen pair (§8 step 2 — see the benchmark table in README.md).
engines = [
    "chords-backend[audio,engines-btc,engines-beat-this]",
]

# BTC — the chord engine. `torch` is the CPU build; the model is small and a GPU
# mostly buys cold-start latency (§18). The checkout itself is not a pip
# dependency: BTC is research code with no package, so the worker image clones
# it and points CHORDS_BTC_ROOT at the result (see modal_app.py).
engines-btc = [
    "torch>=2.0,<3",
    "librosa>=0.10",
    "pyyaml>=6",
    # A dependency of the *checkout*, not of anything imported here: BTC's
    # `utils/mir_eval_modules` (where `idx2voca_chord` lives) imports it. Nothing
    # in this repo names `mir_eval`, so it is invisible to a grep and to every
    # local test — and a machine that happens to have it, as any bench run does,
    # analyzes fine while a clean install fails every job in the chord stage.
    "mir_eval>=0.7",
]

# Beat This! — the beat tracker. Installed from git: there is no PyPI release.
engines-beat-this = [
    "torch>=2.0,<3",
    # Named explicitly although `beat-this` already requires it (unpinned), so
    # that it is installed from whatever index torch came from. On Linux the
    # default PyPI torchaudio wheel is the CUDA build, which links
    # `libcudart.so.13` and cannot be imported on a CPU-only machine — and it
    # fails at `import beat_this.inference`, not at install time. macOS wheels
    # have no CUDA variant, which is why a Mac never sees this. See the matching
    # note in modal_app.py, where the deployed image pins both to the CPU index.
    "torchaudio",
    "einops",
    "soxr",
    "rotary-embedding-torch",
    # Pinned to a commit, matching modal_app.py: a branch zip would mean two
    # deploys of identical code could install different models.
    "beat-this @ https://github.com/CPJKU/beat_this/archive/b95c8ab0c58c2d9fcfd40508ae8dffbc05ac4f5c.zip",
]

# The chroma-template baseline. Not deployed — it is the benchmark's control,
# and the reason the numbers above mean anything.
engines-chroma = [
    "librosa>=0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
